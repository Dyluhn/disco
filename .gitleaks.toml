# Secret-scan config (P11 release engineering, 2026-07-03).
# Full-history scan: 65 findings triaged, ALL false positives —
#   64 = synthetic fixtures inside redaction/schema tests (fake Stripe/GitHub/
#        Slack tokens that exist precisely to prove the redaction machinery),
#   1  = harness cassette "key" field (sha256[:16] request-hash cache key,
#        see harness/cassette.py cassette_key(), not a credential).
# Real secrets never enter the repo: they live in the encrypted SecretStore
# (DISCO_SECRET_KEY Fernet) or the env; the MCP launcher allowlists child env.

[extend]
useDefault = true

[allowlist]
description = "Synthetic test fixtures + cassette request-hash keys"
paths = [
    '''packages/.*/tests/.*''',
    '''frontend/e2e-full/support/.*\.test\.ts''',
    '''frontend/src/.*\.test\.tsx?''',
    '''harness/cassettes/.*\.jsonl''',
    '''\.claude/.*''',
]
