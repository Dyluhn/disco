<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Disco — research</title>
    <!-- Runtime backend config (window.__PMX_ENV). Generated per-deploy; must load before the app bundle. -->
    <script src="/env.js"></script>
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('pmx-theme');
          const pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          const theme = saved || pref;
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
