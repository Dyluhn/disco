# The single front door (2026-07-09): the browser talks ONLY to this origin.
# nginx serves the SPA and reverse-proxies both backends under path prefixes —
# /svc/app → app-server:8800 (settings/library), /svc/agent → agent-server:8000
# (conversations/WS/files/preview). One origin means: no CORS in the live path,
# no API-host discovery in env.js, one cookie, one pairing. The backends' direct
# ports stay published (loopback-bound) for dev/debug only.

# WebSocket upgrade plumbing for the proxied streams (research/build WS, HMR).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve an OUTER TLS terminator's X-Forwarded-Proto (e.g. a domain deploy
# with its own reverse proxy in front of this container); fall back to our own
# scheme. The agent-server uses this to mint https preview bootstrap URLs on
# https pages (mixed-content otherwise).
map $http_x_forwarded_proto $xfp {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Docker's embedded DNS. Resolving the backend names AT REQUEST TIME (via the
# variable proxy_pass below) instead of once at config load means a backend
# container recreate (new IP) never 502s the front door until nginx restarts —
# found live 2026-07-09 on the first backend redeploy under the front door.
resolver 127.0.0.11 valid=10s ipv6=off;

# Versioned origin-true preview hosts. p2 is the live-port origin; p3s is the
# dedicated per-CID static/path origin. The agent-server's host-proxy middleware
# routes both by Host, so forward the WHOLE request with the Host untouched.
# Regex server_names are matched before the default server.
server {
    listen 80;
    # Quoted: regex braces ({8}) would otherwise be parsed as config blocks.
    server_name "~^(?:p2-[0-9a-f]{8}-\d{2,5}|p3s-[0-9a-f]{8}-[0-9a-f]{40}-\d{2,5})\.";

    location / {
        set $agent_upstream agent-server;
        proxy_pass http://$agent_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime-generated, per-deploy config. Never cache it.
    location = /env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build assets are content-addressed and safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # app-server: settings + config + library. The trailing slashes strip the
    # /svc/app prefix, so the backend sees its native paths (/api/models, ...).
    # $http_host (not $host) preserves the PORT — the servers compare the browser's
    # Origin against this Host for the same-origin check, and Origin carries a port.
    location /svc/app/ {
        set $app_upstream app-server;
        # With a VARIABLE upstream, proxy_pass does no automatic prefix-strip —
        # the rewrite does it explicitly (same /svc/app/x → /x mapping as before).
        rewrite ^/svc/app(/.*)$ $1 break;
        proxy_pass http://$app_upstream:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xfp;
        client_max_body_size 512m;
    }

    # agent-server: conversations, research/build WebSockets, files, exports.
    # Long-lived streams: no buffering, generous read timeout.
    location /svc/agent/ {
        set $agent_upstream agent-server;
        rewrite ^/svc/agent(/.*)$ $1 break;
        proxy_pass http://$agent_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 512m;
    }

    # Isolated preview bootstrap and committed-preview traffic deliberately use
    # an origin different from the SPA. These default-server routes remain for
    # compatibility; canonical p3s traffic is caught by the preview-host server.
    location ^~ /__disco/path-preview-auth/ {
        set $agent_upstream agent-server;
        proxy_pass http://$agent_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /__disco/isolated-preview/ {
        set $agent_upstream agent-server;
        proxy_pass http://$agent_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # SPA fallback: client-side routes (/build/:cid, /settings, ...) resolve to
    # index.html so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
