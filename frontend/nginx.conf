server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime-generated, per-deploy config. Never cache it.
    location = /env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build assets are content-addressed and safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes (/build/:cid, /settings, ...) resolve to
    # index.html so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
