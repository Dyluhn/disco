# The single front door (2026-07-09): the browser talks ONLY to this origin.
# nginx serves the SPA and reverse-proxies both backends under path prefixes —
# /svc/app → app-server:8800 (settings/library), /svc/agent → agent-server:8000
# (conversations/WS/files/preview). One origin means: no CORS in the live path,
# no API-host discovery in env.js, one cookie, one pairing. The backends' direct
# ports stay published (loopback-bound) for dev/debug only.

# WebSocket upgrade plumbing for the proxied streams (research/build WS, HMR).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve an OUTER TLS terminator's X-Forwarded-Proto (e.g. a domain deploy
# with its own reverse proxy in front of this container); fall back to our own
# scheme. The agent-server uses this to mint https preview bootstrap URLs on
# https pages (mixed-content otherwise).
map $http_x_forwarded_proto $xfp {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Origin-true preview hosts ({cid8}-{port}.localhost:8088). The agent-server's
# host-proxy middleware routes these by Host, so forward the WHOLE request with
# the Host untouched. Regex server_names are matched before the default server.
server {
    listen 80;
    # Quoted: regex braces ({8}) would otherwise be parsed as config blocks.
    server_name "~^[0-9a-f]{8}-\d{2,5}\.";

    location / {
        proxy_pass http://agent-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime-generated, per-deploy config. Never cache it.
    location = /env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build assets are content-addressed and safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # app-server: settings + config + library. The trailing slashes strip the
    # /svc/app prefix, so the backend sees its native paths (/api/models, ...).
    # $http_host (not $host) preserves the PORT — the servers compare the browser's
    # Origin against this Host for the same-origin check, and Origin carries a port.
    location /svc/app/ {
        proxy_pass http://app-server:8800/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xfp;
        client_max_body_size 512m;
    }

    # agent-server: conversations, research/build WebSockets, files, exports.
    # Long-lived streams: no buffering, generous read timeout.
    location /svc/agent/ {
        proxy_pass http://agent-server:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 512m;
    }

    # SPA fallback: client-side routes (/build/:cid, /settings, ...) resolve to
    # index.html so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
