# disco — one-command self-host.
#
#   cp .env.example .env        # then read it; set DISCO_BIND/model as you like
#   docker compose up -d --build
#   open http://localhost:8088
#
# Defaults bind to 127.0.0.1 — there is NO AUTH in v1. Do not set DISCO_BIND=0.0.0.0
# without your own TLS + auth in front. The sandbox-socket mount makes the
# agent-server root-equivalent on your host; see docs/self-host.md#security.
name: disco

services:
  # Build-only: deposits the sandbox image into the host daemon so the agent-server
  # (talking to the mounted socket) finds it. The agent never pulls — the image must
  # pre-exist. `entrypoint: true` makes the container exit 0 immediately after build.
  sandbox-image:
    build:
      context: .
      dockerfile: deploy/sandbox/Dockerfile
    image: disco-sandbox:base
    entrypoint: ["true"]
    restart: "no"

  app-server:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.server
    image: disco-server
    command: ["python", "-m", "disco.app_server"]
    entrypoint: ["/entrypoint.sh"]
    env_file: .env
    environment:
      DISCO_HOST: "0.0.0.0"
      DISCO_PORT: "8800"
      DISCO_DB: /data/disco.db
      DISCO_CONFIG: /data/disco-config.json
      DISCO_SECRETS: /data/secrets.json
      DISCO_SKILLS_DIR: /data/skills
    volumes:
      - disco-data:/data
    ports:
      - "${DISCO_BIND:-${PMX_BIND:-127.0.0.1}}:${DISCO_APP_PORT:-${PMX_APP_PORT:-8800}}:8800"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8800/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  agent-server:
    image: disco-server # same image as app-server, different command
    command: ["python", "-m", "disco.agent_server"]
    entrypoint: ["/entrypoint.sh"]
    env_file: .env
    environment:
      DISCO_HOST: "0.0.0.0"
      DISCO_PORT: "8000"
      DISCO_DB: /data/disco.db # ONE SQLite file, shared with app-server
      DISCO_CONFIG: /data/disco-config.json
      DISCO_SECRETS: /data/secrets.json
      DISCO_SKILLS_DIR: /data/skills
      DISCO_TTS_DIR: /data/cache/tts
      DISCO_PROJECTS_ROOT: /data/projects
      FASTEMBED_CACHE_PATH: /data/cache/fastembed
      # --- memory hygiene (OOM floor fix) ---------------------------------
      # Deep Research's bursty concurrent gather + in-process ONNX encoders
      # fragment the heap; the glibc allocator then strands freed pages mid-heap
      # (RSS floor never recedes). LD_PRELOAD jemalloc (shipped in the image) —
      # its background_thread purges dirty pages to the OS even under
      # fragmentation. MALLOC_CONF tunes that decay; MALLOC_ARENA_MAX is the
      # glibc fallback if the preload is ever absent (harmless under jemalloc).
      # Peak is bounded separately by the RAM-aware gather concurrency cap.
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
      MALLOC_CONF: "background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000"
      MALLOC_ARENA_MAX: "2"
      # Where the agent-server reaches sandbox-published preview ports (host-gateway).
      DISCO_PREVIEW_HOST: "${DISCO_PREVIEW_HOST:-${PMX_PREVIEW_HOST:-host.docker.internal}}"
      # NOTE: DISCO_SANDBOX is intentionally UNSET — the backend stays Settings-driven
      # (defaults to `local`, which uses the mounted socket below).
    volumes:
      - disco-data:/data
      # The host container socket → the agent-server spawns sibling sandbox
      # containers through it. SECURITY: this is root-equivalent on the host;
      # prefer a rootless Podman socket (see .env.example + docs/self-host.md).
      - "${DISCO_SANDBOX_SOCKET:-${PMX_SANDBOX_SOCKET:-/var/run/docker.sock}}:/var/run/docker.sock"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DISCO_BIND:-${PMX_BIND:-127.0.0.1}}:${DISCO_AGENT_PORT:-${PMX_AGENT_PORT:-8000}}:8000"
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      app-server:
        condition: service_healthy # the seed runs once; let app-server win the race
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: disco-frontend
    environment:
      # Blank explicit URLs → env.js falls back to the browser's own hostname +
      # these ports, so localhost AND LAN access work with zero config.
      DISCO_PUBLIC_API_BASE: "${DISCO_PUBLIC_API_BASE:-${PMX_PUBLIC_API_BASE:-}}"
      DISCO_PUBLIC_AGENT_BASE: "${DISCO_PUBLIC_AGENT_BASE:-${PMX_PUBLIC_AGENT_BASE:-}}"
      DISCO_APP_PORT: "${DISCO_APP_PORT:-${PMX_APP_PORT:-8800}}"
      DISCO_AGENT_PORT: "${DISCO_AGENT_PORT:-${PMX_AGENT_PORT:-8000}}"
    ports:
      - "${DISCO_BIND:-${PMX_BIND:-127.0.0.1}}:${DISCO_UI_PORT:-${PMX_UI_PORT:-8088}}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/env.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      app-server:
        condition: service_healthy
      agent-server:
        condition: service_healthy
    restart: unless-stopped

  # NO bundled driver model. A keyless CPU 4B is a demo, not a real driver — the
  # reliability wedge needs a 24-32B-class model. So you WIRE IN the driver: set
  # DISCO_DRIVER_BASE_URL (+ DISCO_DRIVER_MODEL / api key) in .env to either a
  # self-hosted endpoint (Ollama, llama.cpp, vLLM, LM Studio — local or on your
  # LAN) or a paid API (OpenAI-compatible). The bundled/self-host/paid tiers for
  # the ENCODERS, SEARCH, EXTRACTION, and TTS still ship keyless. See
  # docs/self-host.md#models.

volumes:
  disco-data: # db + config + secrets + skills + projects + tts/encoder caches
