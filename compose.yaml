# disco — one-command self-host.
#
#   podman compose up -d --build
#   open http://localhost:8088
#
# Optional: copy .env.example to .env when you need non-default ports, provider
# keys, or the explicitly less-safe root Docker socket. The model endpoint is
# configured in the UI after boot.
#
# Defaults bind to 127.0.0.1. Do not set DISCO_BIND=0.0.0.0 without your own TLS
# and auth boundary in front. The sandbox daemon defaults to the current user's
# rootless Podman socket; /var/run/docker.sock is never selected implicitly.
name: disco

services:
  # Build-only: deposits the sandbox image into the host daemon so the agent-server
  # (talking to the mounted socket) finds it. The agent never pulls — the image must
  # pre-exist. `entrypoint: true` makes the container exit 0 immediately after build.
  # Builds by DEFAULT: the Build/Agent surfaces need this image to exist. Comment
  # this service out (and the agent-server depends_on below) for a lean stack.
  sandbox-image:
    build:
      context: .
      dockerfile: current/deploy/sandbox/Dockerfile
    image: disco-sandbox:base
    entrypoint: ["true"]
    restart: "no"

  app-server:
    build:
      context: .
      dockerfile: current/deploy/compose/Dockerfile.server
    image: disco-server
    command: ["python", "-m", "disco.app_server"]
    entrypoint: ["/entrypoint.sh"]
    environment:
      DISCO_HOST: "0.0.0.0"
      DISCO_PORT: "8800"
      DISCO_DATA_DIR: /data
      DISCO_DB: /data/disco.db
      DISCO_CONFIG: /data/disco-config.json
      DISCO_SECRETS: /data/secrets.json
      DISCO_APPROVALS: /data/disco-approved-origins.json
      DISCO_SKILLS_DIR: /data/skills
      DISCO_UI_PORT: "${DISCO_UI_PORT:-${PMX_UI_PORT:-8088}}"
      DISCO_PUBLIC_UI_URL: "${DISCO_PUBLIC_UI_URL:-}"
      # The bind posture drives first-run auth: loopback-bound (this default) →
      # a localhost front-door page auto-pairs tokenlessly (the ports are
      # kernel-unreachable from other machines); 0.0.0.0/LAN → token required.
      # Keep in LOCKSTEP with the agent-server block + the ports mappings below.
      DISCO_BIND: "${DISCO_BIND:-${PMX_BIND:-127.0.0.1}}"
      DISCO_SECRET_KEY: "${DISCO_SECRET_KEY:-${PMX_SECRET_KEY:-}}"
      DISCO_SECRET_KEY_ID: "${DISCO_SECRET_KEY_ID:-}"
      DISCO_SECRET_READ_KEYS: "${DISCO_SECRET_READ_KEYS:-}"
      DISCO_AUTH_DEV_AUTO_PAIR: "${AUTH_DEV_AUTO_PAIR:-${DISCO_AUTH_DEV_AUTO_PAIR:-${PMX_AUTH_DEV_AUTO_PAIR:-0}}}"
      DISCO_OPENROUTER_API_KEY: "${DISCO_OPENROUTER_API_KEY:-${PMX_OPENROUTER_API_KEY:-}}"
      DISCO_GEMMA_API_KEY: "${DISCO_GEMMA_API_KEY:-${PMX_GEMMA_API_KEY:-}}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
      COMFYUI_API_KEY: "${COMFYUI_API_KEY:-}"
      OPENAI_IMAGE_API_KEY: "${OPENAI_IMAGE_API_KEY:-}"
      OPENAI_TTS_API_KEY: "${OPENAI_TTS_API_KEY:-}"
      DISCO_LOG_LEVEL: "${DISCO_LOG_LEVEL:-${PMX_LOG_LEVEL:-INFO}}"
      DISCO_LOG_JSON: "${DISCO_LOG_JSON:-0}"
    volumes:
      - disco-data:/data
    ports:
      - "${DISCO_BIND:-${PMX_BIND:-127.0.0.1}}:${DISCO_APP_PORT:-${PMX_APP_PORT:-8800}}:8800"
    # The app-server owns provider /models probes. Give it the same stable host
    # alias as agent-server so the keyless Ollama preset works under Compose.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8800/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  agent-server:
    image: disco-server # same image as app-server, different command
    command: ["python", "-m", "disco.agent_server"]
    entrypoint: ["/entrypoint.sh"]
    environment:
      DISCO_HOST: "0.0.0.0"
      DISCO_PORT: "8000"
      DISCO_DATA_DIR: /data
      # One transactional DB is also the preview-intent replay boundary. Do not
      # scale preview-serving replicas onto independent DB files while sharing
      # DISCO_SECRET_KEY; see docs/self-host.md#scaling-and-preview-redemption.
      DISCO_DB: /data/disco.db # ONE SQLite file, shared with app-server
      DISCO_CONFIG: /data/disco-config.json
      DISCO_SECRETS: /data/secrets.json
      DISCO_APPROVALS: /data/disco-approved-origins.json
      DISCO_SKILLS_DIR: /data/skills
      DISCO_TTS_DIR: /opt/disco-cache/tts
      DISCO_PROJECTS_ROOT: /data/projects
      FASTEMBED_CACHE_PATH: /opt/disco-cache/fastembed
      DISCO_ENCODER_TIER: "${DISCO_ENCODER_TIER:-${PMX_ENCODER_TIER:-full}}"
      DISCO_ENCODERS: "${DISCO_ENCODERS:-${PMX_ENCODERS:-local}}"
      # Remote encoder endpoints are read by the retrieval runtime in this
      # service. Empty values preserve the bundled local encoder default.
      DISCO_RERANKER_URL: "${DISCO_RERANKER_URL:-${PMX_RERANKER_URL:-}}"
      DISCO_EMBEDDER_URL: "${DISCO_EMBEDDER_URL:-${PMX_EMBEDDER_URL:-}}"
      DISCO_NLI_URL: "${DISCO_NLI_URL:-${PMX_NLI_URL:-}}"
      DISCO_SECRET_KEY: "${DISCO_SECRET_KEY:-${PMX_SECRET_KEY:-}}"
      DISCO_SECRET_KEY_ID: "${DISCO_SECRET_KEY_ID:-}"
      DISCO_SECRET_READ_KEYS: "${DISCO_SECRET_READ_KEYS:-}"
      # The agent-server enforces the SAME CORS/pairing origin allowlist as the
      # app-server, so it needs the public UI URL too — without it a LAN/tailnet
      # browser pairs the app-server but is 403'd by the agent-server (found live
      # 2026-07-09). Keep in lockstep with the app-server block above.
      DISCO_PUBLIC_UI_URL: "${DISCO_PUBLIC_UI_URL:-}"
      # Optional remote security boundary. This must be a wildcard-routed origin
      # on a different registrable site from the UI (see docs/self-host.md).
      DISCO_PREVIEW_ORIGIN_BASE: "${DISCO_PREVIEW_ORIGIN_BASE:-}"
      # Firefox-safe canonical Preview origins. The agent process listens on
      # every bounded gateway port inside the container; Compose exposes those
      # listeners on host loopback only, never on the operator's LAN bind.
      DISCO_LOCAL_PREVIEW_BIND: "0.0.0.0"
      DISCO_LOCAL_PREVIEW_PORT_START: "19120"
      DISCO_LOCAL_PREVIEW_PORT_COUNT: "32"
      # Bind posture for first-run auth — keep in LOCKSTEP with the app-server
      # block above (see the comment there).
      DISCO_BIND: "${DISCO_BIND:-${PMX_BIND:-127.0.0.1}}"
      DISCO_AUTH_DEV_AUTO_PAIR: "${AUTH_DEV_AUTO_PAIR:-${DISCO_AUTH_DEV_AUTO_PAIR:-${PMX_AUTH_DEV_AUTO_PAIR:-0}}}"
      DISCO_OPENROUTER_API_KEY: "${DISCO_OPENROUTER_API_KEY:-${PMX_OPENROUTER_API_KEY:-}}"
      DISCO_GEMMA_API_KEY: "${DISCO_GEMMA_API_KEY:-${PMX_GEMMA_API_KEY:-}}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
      COMFYUI_API_KEY: "${COMFYUI_API_KEY:-}"
      OPENAI_IMAGE_API_KEY: "${OPENAI_IMAGE_API_KEY:-}"
      OPENAI_TTS_API_KEY: "${OPENAI_TTS_API_KEY:-}"
      DISCO_LOG_LEVEL: "${DISCO_LOG_LEVEL:-${PMX_LOG_LEVEL:-INFO}}"
      # Reliability/operator diagnostics. Inspect remains explicitly opt-in;
      # JSON logs make model/tool thrash machine-readable in captured compose logs.
      DISCO_INSPECT: "${DISCO_INSPECT:-0}"
      DISCO_LOG_JSON: "${DISCO_LOG_JSON:-0}"
      # Runtime policy toggles belong to the agent-server: it resolves model
      # vision capability and constructs every Build sandbox egress posture.
      DISCO_DRIVER_VISION: "${DISCO_DRIVER_VISION:-${PMX_DRIVER_VISION:-0}}"
      DISCO_BUILD_EGRESS: "${DISCO_BUILD_EGRESS:-${PMX_BUILD_EGRESS:-filtered}}"
      # --- memory hygiene (OOM floor fix) ---------------------------------
      # Deep Research's bursty concurrent gather + in-process ONNX encoders
      # fragment the heap; the glibc allocator then strands freed pages mid-heap
      # (RSS floor never recedes). LD_PRELOAD jemalloc (shipped in the image) —
      # its background_thread purges dirty pages to the OS even under
      # fragmentation. MALLOC_CONF tunes that decay; MALLOC_ARENA_MAX is the
      # glibc fallback if the preload is ever absent (harmless under jemalloc).
      # Peak is bounded separately by the RAM-aware gather concurrency cap.
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
      MALLOC_CONF: "background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000"
      MALLOC_ARENA_MAX: "2"
      # Where the agent-server reaches sandbox-published preview ports (host-gateway).
      DISCO_PREVIEW_HOST: "${DISCO_PREVIEW_HOST:-${PMX_PREVIEW_HOST:-host.docker.internal}}"
      # gVisor: DISCO_LOCAL_RUNTIME=runsc runs every spawned sandbox container
      # under gVisor (host prereq: runsc installed + registered in the selected
      # Podman/Docker daemon's runtimes — https://gvisor.dev/docs/user_guide/install/).
      # Default runc
      # keeps today's behavior:
      #   DISCO_LOCAL_RUNTIME=runsc podman compose up -d
      DISCO_LOCAL_RUNTIME: "${DISCO_LOCAL_RUNTIME:-runc}"
      # The socket target is intentionally engine-neutral. Preserve the host
      # daemon identity so rootless Podman uses its native exec transport rather
      # than the unreliable Docker-compat detached-exec endpoint.
      DISCO_LOCAL_ENGINE: "${DISCO_LOCAL_ENGINE:-podman}"
      # Blank keeps the backend Settings-driven. Non-blank is an explicit operator
      # override; `process` additionally requires the dev-only opt-in below.
      DISCO_SANDBOX: "${DISCO_SANDBOX:-}"
      DISCO_ALLOW_PROCESS_SANDBOX_FOR_DEV: "${DISCO_ALLOW_PROCESS_SANDBOX_FOR_DEV:-0}"
    volumes:
      - disco-data:/data
      # Docker-compatible API endpoint used to spawn sibling sandbox containers.
      # SAFE DEFAULT: the current user's rootless Podman socket. The fixed target
      # is an in-container Docker-API compatibility name; it does not imply that
      # the host source is Docker or root-owned. Operators who deliberately accept
      # Docker's root-equivalent source must opt in with
      # DISCO_SANDBOX_SOCKET=/var/run/docker.sock.
      - "${DISCO_SANDBOX_SOCKET:-${PMX_SANDBOX_SOCKET:-${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock}}:/var/run/docker.sock"
    # SELinux otherwise denies access to a rootless Podman socket even though
    # the explicit bind mount is present. This service already holds authority
    # over that daemon; disabling its container label does not broaden the
    # selected socket's host permissions.
    security_opt:
      - label=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DISCO_BIND:-${PMX_BIND:-127.0.0.1}}:${DISCO_AGENT_PORT:-${PMX_AGENT_PORT:-8000}}:8000"
      # One literal loopback host per Preview lease. Cookies are host-scoped,
      # not port-scoped, so publishing every listener on 127.0.0.1 would let
      # generated applications overwrite one another's session cookies.
      - "127.0.0.2:19120:19120"
      - "127.0.0.3:19121:19121"
      - "127.0.0.4:19122:19122"
      - "127.0.0.5:19123:19123"
      - "127.0.0.6:19124:19124"
      - "127.0.0.7:19125:19125"
      - "127.0.0.8:19126:19126"
      - "127.0.0.9:19127:19127"
      - "127.0.0.10:19128:19128"
      - "127.0.0.11:19129:19129"
      - "127.0.0.12:19130:19130"
      - "127.0.0.13:19131:19131"
      - "127.0.0.14:19132:19132"
      - "127.0.0.15:19133:19133"
      - "127.0.0.16:19134:19134"
      - "127.0.0.17:19135:19135"
      - "127.0.0.18:19136:19136"
      - "127.0.0.19:19137:19137"
      - "127.0.0.20:19138:19138"
      - "127.0.0.21:19139:19139"
      - "127.0.0.22:19140:19140"
      - "127.0.0.23:19141:19141"
      - "127.0.0.24:19142:19142"
      - "127.0.0.25:19143:19143"
      - "127.0.0.26:19144:19144"
      - "127.0.0.27:19145:19145"
      - "127.0.0.28:19146:19146"
      - "127.0.0.29:19147:19147"
      - "127.0.0.30:19148:19148"
      - "127.0.0.31:19149:19149"
      - "127.0.0.32:19150:19150"
      - "127.0.0.33:19151:19151"
    depends_on:
      # NOTE: no container-state dependency on sandbox-image — it exits 0 by design
      # and podman-compose rejects an exited dependency ("container state improper").
      # `up --build` still builds it by default; the agent only needs the IMAGE to
      # exist in the daemon, not a running container.
      app-server:
        condition: service_healthy # the seed runs once; let app-server win the race
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: current/frontend/Dockerfile
    image: disco-frontend
    environment:
      # Blank explicit URLs → env.js defaults to SAME-ORIGIN relative prefixes
      # (/svc/app, /svc/agent) that this container's nginx proxies to the
      # backends — the single front door. Set absolute URLs only for a
      # split-origin deployment that terminates the backends elsewhere.
      DISCO_PUBLIC_API_BASE: "${DISCO_PUBLIC_API_BASE:-${PMX_PUBLIC_API_BASE:-}}"
      DISCO_PUBLIC_AGENT_BASE: "${DISCO_PUBLIC_AGENT_BASE:-${PMX_PUBLIC_AGENT_BASE:-}}"
    ports:
      - "${DISCO_BIND:-${PMX_BIND:-127.0.0.1}}:${DISCO_UI_PORT:-${PMX_UI_PORT:-8088}}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/env.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      app-server:
        condition: service_healthy
      agent-server:
        condition: service_healthy
    restart: unless-stopped

  # NO bundled driver model. Configure an OpenAI-compatible local/LAN or paid
  # endpoint in Settings after boot, then run `disco-verify` in the agent-server.
  # The bundled encoders, search, extraction, and Kokoro TTS are keyless and baked
  # into the default server image. See docs/self-host.md#models.

volumes:
  disco-data: # db + config + encrypted secrets + skills + projects + generated audio
