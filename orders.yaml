# orders.yaml — commit-sequencing manifest for the BP work-order campaign.
#
# Consumed by scripts/orchestrate.sh (parsed with awk — keep the format STRICT):
#   <order-id>: <state>    # committed = done | staged = declared, NO work on disk,
#                          #   claims nothing (dispatch flips it to in-flight)
#                          # | in-flight/anything else = live (files contested)
#     - <repo-relative path>
#
# Rules the orchestrator enforces from this data (bakeoff/SUMMARY.md: orchestration
# plumbing moves to bash):
#   * two orders that touch the same file may never be dispatched concurrently
#   * an order may not be committed while another order's changes are uncommitted
#     in any file the two share
#   * a commit for an order stages ONLY that order's files
#
# Maintenance: add an order's file list when its surgical brief is authored (the
# brief is the source of truth for what it touches). Remove nothing — committed
# orders are kept for the record; the script only enforces against orders with
# uncommitted changes or an active dispatch.

