  # Engine confirm/reject LIVELOCK fix (orchestrator-authored, NOT a Gemini worker;
  # subtle security-loop logic). Two compounding defects: (A) the Rung-7 unknown-tool
  # requery swallowed an unregistered publish-class name (`deploy_site`) BEFORE
  # BlastRadiusConfirm's publish guard could pause → plan read "done" with nothing
  # executed; (B) the execution-finish gate `continue`d with no real backstop
  # (max_iterations never advances on a nudge-only turn) → infinite spin. Fix:
  # publish-class names bypass the requery to reach the confirm gate (new duck-typed
  # policy.gates_by_name hook); the execution-nudge routes through the shared
  # _actionless_valve like the (g) no-op path. Unblocks the 2 formerly-livelocking
  # test_build_surface.py tests (no longer need deselection). pinned-Fable APPROVE
