# Architecture fitness functions (also enforced in CI's required job).
# Install: `uv run pre-commit install`  (or `pip install pre-commit && pre-commit install`)
repos:
  - repo: local
    hooks:
      # Runs FIRST: if a counted lane is live, nothing else about this commit
      # matters — landing it would split one campaign across two SHAs.
      - id: soak-freeze
        name: no commits while a build-soak batch is running
        entry: python development/scripts/check_soak_freeze.py
        language: system
        pass_filenames: false
        always_run: true
      - id: governance-seal
        name: governance seal (protected files + invocation contract)
        entry: python development/scripts/check_governance_seal.py
        language: system
        pass_filenames: false
        always_run: true
      - id: arch-budget
        name: architecture size budget (no god-objects)
        entry: python development/scripts/check_arch_budget.py
        language: system
        pass_filenames: false
        always_run: true
      - id: arch-debt
        name: architecture debt ratchet (shrink-only)
        entry: python development/scripts/check_arch_debt.py
        language: system
        pass_filenames: false
        always_run: true
      - id: arch-imports
        name: architecture imports/context graph
        entry: python development/scripts/check_arch_imports.py
        language: system
        pass_filenames: false
        always_run: true
      - id: arch-diagram-fresh
        name: architecture diagram is regenerated
        entry: python development/scripts/gen_arch_diagram.py --check
        language: system
        pass_filenames: false
        always_run: true
