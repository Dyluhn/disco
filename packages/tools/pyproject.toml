# The `tools` package — the action space (BoD §5). Empty placeholder in Phase 0;
# the Tool/Sandbox contract fills it in a later phase.
[project]
name = "perpleximanus-tools"
version = "0.1.0"
description = "Tool/action space for the perpleximanus platform (placeholder)."
requires-python = ">=3.12"
dependencies = [
    "perpleximanus-core",
    # Docker SDK — the gVisor backend drives the daemon over the local socket OR
    # Docker-over-SSH (the [ssh] extra makes ssh:// importable; use_ssh_client=True
    # still authenticates via the system ssh, e.g. keyless Tailscale SSH).
    "docker[ssh]>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perpleximanus"]

[tool.uv.sources]
perpleximanus-core = { workspace = true }
