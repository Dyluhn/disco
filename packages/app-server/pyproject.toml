# The `app-server` package — the user-facing orchestrator (BoD §5.2). Empty
# placeholder in Phase 0; manages many conversations, library, spaces, settings.
[project]
name = "perpleximanus-app-server"
version = "0.1.0"
description = "User-facing orchestrator for the perpleximanus platform (placeholder)."
requires-python = ">=3.12"
dependencies = ["perpleximanus-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perpleximanus"]

[tool.uv.sources]
perpleximanus-core = { workspace = true }
