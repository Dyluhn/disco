# The `retrieval` package — Retrieval Engine + Citation/Grounding (BoD §9 + §14).
# A sibling of `tools`: the search/extract tools reach this engine via the
# orchestrator-mediated CapabilitySet, so retrieval depends only on `core`.
[project]
name = "perpleximanus-retrieval"
version = "0.1.0"
description = "Retrieval engine (discovery/extraction/rerank) + grounding/citation pipeline."
requires-python = ">=3.12"
dependencies = [
    "perpleximanus-core",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perpleximanus"]

[tool.uv.sources]
perpleximanus-core = { workspace = true }
