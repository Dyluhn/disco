# The `retrieval` package — Retrieval Engine + Citation/Grounding (BoD §9 + §14).
# A sibling of `tools`: the search/extract tools reach this engine via the
# orchestrator-mediated CapabilitySet, so retrieval depends only on `core`.
[project]
name = "disco-retrieval"
version = "0.2.0"
description = "Retrieval engine (discovery/extraction/rerank) + grounding/citation pipeline."
requires-python = ">=3.12"
dependencies = [
    "disco-core",
    "httpx>=0.27",
    "fastembed>=0.8",  # in-process ONNX/CPU encoders (embed/rerank/NLI) — see local_encoders.py
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "huggingface-hub>=0.20",
    "numpy>=1.26",
    "jsonschema>=4.20.0",
    "pypdf>=6.17,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disco"]

[tool.uv.sources]
disco-core = { workspace = true }
