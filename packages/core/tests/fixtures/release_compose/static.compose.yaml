services:
  web:
    build:
      context: "."
      dockerfile: "Dockerfile"
    restart: "unless-stopped"
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "-O"
        - "-"
        - "http://127.0.0.1:8080/"
      interval: "10s"
      timeout: "3s"
      retries: 5
      start_period: "20s"
