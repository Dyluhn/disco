# The `agent-server` package — per-conversation runtime (BoD §5). In Phase 0 it
# exposes the §7 wire layer (WebSocket event/state streaming + reconnect/replay)
# and the §7.5 REST surface over the core EventStore. No agent loop yet.
[project]
name = "perpleximanus-agent-server"
version = "0.1.0"
description = "Per-conversation runtime: WebSocket + REST over the core event log."
requires-python = ">=3.12"
dependencies = [
    "perpleximanus-core",
    "perpleximanus-retrieval",
    "perpleximanus-tools",  # the Build surface composes the agent toolset + sandbox here
    "fastapi>=0.110",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30",  # [standard] pulls the websockets impl the WS routes need
    "websockets>=12.0",
    "cronsim>=2.6",
    "weasyprint>=63.0",  # RP-07: PDF export (md → HTML → WeasyPrint)
    "markdown>=3.5",  # RP-07: faithful md → HTML for the PDF path (tables/lists/etc.)
]

[project.optional-dependencies]
# RP-09 in-process Kokoro TTS — OPTIONAL so the lean core install stays lean. Rides
# the onnxruntime already pulled by fastembed (deliberately NOT torch). Install with
# `uv sync --extra tts` (or the compose's tts profile). Weights download on first use.
tts = [
    "kokoro-onnx>=0.4",
    "lameenc>=1.7",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perpleximanus"]

[tool.uv.sources]
perpleximanus-core = { workspace = true }
perpleximanus-retrieval = { workspace = true }
perpleximanus-tools = { workspace = true }
