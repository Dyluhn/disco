# Frozen Phase-4 counted-soak scenarios. ``{{seed}}`` is replaced once per trial
# by the runner's recorded deterministic seed; ``{{row}}`` is expanded only by
# the bounded imported-fixture generator.
defaults:
  mode: api
  requires_inspect_trace: true
  requires_relay_ledger: true
  lifecycle:
    export_download: true
  terminal_status_in: ["FINISHED", "VERIFIED"]
  assertions:
    event_chain:
      require_user_event: true
      require_plan_before_execution: true
      require_action_observation_pairs: true
    governed_verification:
      required: true
      route: platform
      composition_authority: build_platform_core
      delivery_mode: interactive
      required_receipt_kinds: [disco.web_functional@1]
      required_claim_kinds:
        artifact_identity: 1
        http_ready: 1
        rendered_content: 1
        console_clean: 1
        network_clean: 1
      required_execution_modality: managed_preview
      require_agent_view_binding: true
      require_workspace_epoch: true
    tool_scope:
      planning_disallows:
        - file_write
        - file_append
        - file_edit
        - file_replace_lines
        - shell
        - code_exec
        - browser
        - serve
        - finish
        - remember
        - notify_user
        - delegate_explore
    thrash:
      max_identical_action_repeats: 2
      max_same_tool_error_repeats: 1
      max_actionless_pauses: 0
      max_same_model_repair_repeats: 1
      max_total_model_repairs: 3

scenarios:
  - id: p4_ff_static_basic
    prompt: >-
      Create a polished static index.html and styles.css for a neighborhood event.
      Show the exact heading 'Static Seed {{seed}}', serve it, and verify in a browser
      that the heading is visible before finishing.
    assertions:
      workspace:
        files:
          - path: index.html
            must_contain: ["Static Seed {{seed}}", "styles.css"]
          - path: styles.css
      preview: {required: true, must_contain: ["Static Seed {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_static_steer
    prompt: >-
      Create index.html and styles.css for 'Steer Base {{seed}}' with an About section,
      serve it, and verify it in a browser.
    followups:
      - text: >-
          Also add a Contact section with the exact text 'Steered {{seed}}' and update
          the navigation without removing the About section.
        requires_plan_revision: true
        trigger: after_first_file_write
    assertions:
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        require_acknowledged_followup: true
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: index.html
            must_contain: ["Steer Base {{seed}}", "Steered {{seed}}", "About", "Contact"]
          - path: styles.css
      preview: {required: true, must_contain: ["Steered {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_static_continue
    prompt: >-
      Create and browser-verify a static index.html and styles.css with the exact heading
      'Continue Base {{seed}}'.
    followups:
      - text: >-
          Continue after finish: retain the original heading and add a visible section
          containing the exact text 'Continued {{seed}}', then verify the revised page.
        requires_plan_revision: true
        trigger: after_terminal
    assertions:
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: index.html
            must_contain: ["Continue Base {{seed}}", "Continued {{seed}}"]
          - path: styles.css
      preview: {required: true, must_contain: ["Continued {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_static_cancel_recovery
    prompt: >-
      Create and browser-verify index.html for 'Recovery Static {{seed}}' with the exact
      status text 'All systems nominal {{seed}}'.
    cancel_at: {trigger: after_first_file_write}
    followups:
      - text: >-
          Recover the interrupted build, preserve the requested seed-specific content,
          finish the page, and verify it in the browser.
        requires_plan_revision: true
        trigger: after_terminal
    assertions:
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: index.html
            must_contain: ["Recovery Static {{seed}}", "All systems nominal {{seed}}"]
      preview: {required: true, must_contain: ["Recovery Static {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_react_basic
    prompt: >-
      Build a React application using Vite. Include package.json, index.html, and source
      modules. The rendered page must show the exact heading 'React Seed {{seed}}'. Run
      it through the preview tool and verify the heading in a browser before finishing.
    assertions:
      workspace:
        files:
          - path: package.json
            must_contain: ["react", "vite"]
          - path: index.html
      preview: {required: true, must_contain: ["React Seed {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_react_steer
    prompt: >-
      Build and browser-verify a React/Vite dashboard titled 'React Steer {{seed}}'.
    followups:
      - text: >-
          Add a persistent status panel showing the exact text 'Live steer {{seed}}'
          without replacing the dashboard.
        requires_plan_revision: true
        trigger: after_first_file_write
    assertions:
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        require_acknowledged_followup: true
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: package.json
            must_contain: ["react", "vite"]
          - path: index.html
      preview: {required: true, must_contain: ["Live steer {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_react_continue
    prompt: >-
      Build and browser-verify a React/Vite page with the exact heading
      'React Continue {{seed}}'.
    followups:
      - text: >-
          Plan a revision that retains the heading and adds the exact visible footer
          'React revised {{seed}}', then browser-verify the final result.
        requires_plan_revision: true
        trigger: after_terminal
    assertions:
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: package.json
            must_contain: ["react", "vite"]
          - path: index.html
      preview: {required: true, must_contain: ["React revised {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_react_restart
    prompt: >-
      Build and browser-verify a React/Vite page headed 'React Restart {{seed}}'.
    lifecycle:
      restart_after_terminal: true
    followups:
      - text: >-
          After recovery, retain the heading and add the exact visible text
          'Restart recovered {{seed}}', then verify the revised preview.
        requires_plan_revision: true
        trigger: after_terminal
    assertions:
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: package.json
            must_contain: ["react", "vite"]
          - path: index.html
      preview: {required: true, must_contain: ["Restart recovered {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_node_basic
    # `process.env.PORT` is asserted below, so the prompt has to ASK for it. Saying only
    # "the runtime PORT environment variable" left an equally correct build — the
    # idiomatic `const { PORT = 3000 } = process.env`, which honours PORT exactly —
    # failing on a spelling it was never given (counted seed 440027). Both sibling node
    # scenarios already name it; this one was the outlier. Naming the mechanism is
    # clear context, not a narrowed recipe: the model is told what is wanted instead of
    # being marked wrong for guessing a different idiom.
    prompt: >-
      Build a Node service in server.js that reads its port with process.env.PORT.
      Its root page must show the exact heading 'Node Seed {{seed}}'. Include package.json,
      launch it with the preview tool, and verify the root page in a browser.
    assertions:
      workspace:
        files:
          - path: server.js
            must_contain: ["Node Seed {{seed}}", "process.env.PORT"]
          - path: package.json
      preview: {required: true, must_contain: ["Node Seed {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_node_pause
    prompt: >-
      Build a Node service in server.js using process.env.PORT whose root page shows
      'Node Paused {{seed}}'. Include package.json, preview it, and browser-verify it.
    lifecycle:
      pause_resume_at: after_first_file_write
    assertions:
      workspace:
        files:
          - path: server.js
            must_contain: ["Node Paused {{seed}}", "process.env.PORT"]
          - path: package.json
      preview: {required: true, must_contain: ["Node Paused {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_node_restart
    # `server.js` is asserted below, so the prompt has to ASK for it — index.js,
    # app.js and server.js are all ordinary names for a Node entrypoint, and a
    # build that picks one of the others is correct work failed on a requirement
    # it was never given (seed 406438: the model wrote index.js and the run died
    # FALSE_FINISH_NO_OUTPUT). Both sibling node scenarios already name the file
    # in their prompt; this one was the outlier.
    prompt: >-
      Build and browser-verify a Node service in server.js using process.env.PORT
      with the root heading 'Node Restart {{seed}}'.
    lifecycle:
      restart_after_terminal: true
    followups:
      - text: >-
          After recovery, keep the root page and add a /health endpoint that returns
          the exact text 'healthy {{seed}}'; verify the root page again.
        requires_plan_revision: true
        trigger: after_terminal
    assertions:
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: server.js
            must_contain: ["Node Restart {{seed}}", "healthy {{seed}}", "process.env.PORT"]
          - path: package.json
      preview: {required: true, must_contain: ["Node Restart {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_python_basic
    prompt: >-
      Build a Python web service in app.py using the PORT environment variable and only
      the standard library. Its root page must show 'Python Seed {{seed}}'. Launch it
      with the preview tool and verify the page in a browser.
    assertions:
      workspace:
        files:
          - path: app.py
            must_contain: ["Python Seed {{seed}}", "PORT"]
      preview: {required: true, must_contain: ["Python Seed {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_python_pause
    prompt: >-
      Build a standard-library Python web service in app.py using the PORT environment
      variable. Its browser-verified root page must show 'Python Paused {{seed}}'.
    lifecycle:
      pause_resume_at: after_first_file_write
    assertions:
      workspace:
        files:
          - path: app.py
            must_contain: ["Python Paused {{seed}}", "PORT"]
      preview: {required: true, must_contain: ["Python Paused {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_python_cancel_recovery
    prompt: >-
      Build a standard-library Python web service in app.py using PORT. The root page
      must show 'Python Recovery {{seed}}' and be verified in a browser.
    cancel_at: {trigger: after_first_file_write}
    followups:
      - text: >-
          Recover the interrupted service, preserve the exact requested heading, and
          finish with a browser verification.
        requires_plan_revision: true
        trigger: after_terminal
    assertions:
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: app.py
            must_contain: ["Python Recovery {{seed}}", "PORT"]
      preview: {required: true, must_contain: ["Python Recovery {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_import_basic
    import_fixture:
      filename: imported-static-{{seed}}.zip
      files:
        index.html: "<h1>Imported Seed {{seed}}</h1><link rel='stylesheet' href='styles.css'>"
        styles.css: "body { color: #223; }"
    prompt: >-
      Preserve the imported heading, add a visible section with the exact text
      'Imported Complete {{seed}}', improve the styling, serve the imported project,
      and verify the final page in a browser.
    assertions:
      workspace:
        files:
          - path: index.html
            must_contain: ["Imported Seed {{seed}}", "Imported Complete {{seed}}"]
          - path: styles.css
      preview: {required: true, must_contain: ["Imported Complete {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_import_rollback
    import_fixture:
      filename: imported-rollback-{{seed}}.zip
      files:
        index.html: "<h1>Rollback Seed {{seed}}</h1><main>Original import</main>"
        styles.css: "body { font-family: sans-serif; }"
    prompt: >-
      Add a visible release panel containing 'First revision {{seed}}', style it, serve
      the imported project, and verify it in a browser.
    lifecycle:
      restore_version: previous
    followups:
      - text: >-
          Recover after the version restore: preserve the imported heading and add a
          release panel containing exactly 'Rollback recovered {{seed}}', then verify it.
        requires_plan_revision: true
        trigger: after_terminal
    assertions:
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: index.html
            must_contain: ["Rollback Seed {{seed}}", "Rollback recovered {{seed}}"]
          - path: styles.css
      preview: {required: true, must_contain: ["Rollback recovered {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_context_catalog
    import_fixture:
      filename: context-catalog-{{seed}}.zip
      files:
        catalog.txt:
          line_template: "catalog seed={{seed}} row={{row}} region=alpha-beta-gamma payload=reference-material\n"
          count: 30000
        index.html: "<h1>Context Catalog {{seed}}</h1>"
    prompt: >-
      This is a context-pressure audit. Use file_read (not shell) on catalog.txt at the
      beginning, around line offset 10001, and around line offset 20001, respecting every
      range disclosure receipt. Do not silently reread a range. Create REPORT.md with the
      exact heading 'Catalog Audit {{seed}}' and a short comparison of the three ranges.
      Update index.html to show 'Catalog Audited {{seed}}', serve it, and browser-verify it.
    assertions:
      context_pressure:
        path: catalog.txt
        min_distinct_offsets: 3
        max_reads_per_offset: 2
        require_compaction: true
      workspace:
        files:
          - path: REPORT.md
            must_contain: ["Catalog Audit {{seed}}"]
          - path: index.html
            must_contain: ["Catalog Audited {{seed}}"]
      preview: {required: true, must_contain: ["Catalog Audited {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_ff_context_ledger
    import_fixture:
      filename: context-ledger-{{seed}}.zip
      files:
        ledger.log:
          line_template: "ledger seed={{seed}} row={{row}} cohort=north-south-west payload=durable-observation\n"
          count: 30000
        index.html: "<h1>Context Ledger {{seed}}</h1>"
    prompt: >-
      This is a context-pressure audit. Use file_read (not shell) on ledger.log at the
      beginning, around line offset 12001, and around line offset 24001, respecting every
      range disclosure receipt. Do not silently reread a range. Create REPORT.md headed
      exactly 'Ledger Audit {{seed}}' comparing the ranges. Update index.html to show
      'Ledger Audited {{seed}}', serve it, and browser-verify it.
    assertions:
      context_pressure:
        path: ledger.log
        min_distinct_offsets: 3
        max_reads_per_offset: 2
        require_compaction: true
      workspace:
        files:
          - path: REPORT.md
            must_contain: ["Ledger Audit {{seed}}"]
          - path: index.html
            must_contain: ["Ledger Audited {{seed}}"]
      preview: {required: true, must_contain: ["Ledger Audited {{seed}}"]}
      browser_verification: {required: true}

  - id: p4_appkit_create
    appkit: true
    autonomous: true
    prompt: >-
      Build a strict AppKit local notes app titled exactly 'AppKit Create {{seed}}' with
      add, list, and delete behavior. Verify it and finish without ejecting to Freeform.
    assertions:
      governed_verification:
        required: true
        route: platform
        composition_authority: build_platform_core
        delivery_mode: interactive
        required_receipt_kinds: [disco.appkit_strict@1, disco.web_functional@1]
        required_claim_kinds:
          target_specific: 1
          artifact_identity: 1
          http_ready: 1
          rendered_content: 1
          console_clean: 1
          network_clean: 1
        required_execution_modalities: [appkit_strict_runtime, managed_preview]
        require_agent_view_binding: true
        require_workspace_epoch: true
      tool_scope:
        execution_disallows: [file_write, file_append, file_edit, file_replace_lines, shell, code_exec]
      workspace:
        files:
          - path: .disco/appspec.json
            must_contain: ["AppKit Create {{seed}}"]
          - path: .disco/designspec.json
      preview: {required: true}
      browser_verification: {required: true}

  - id: p4_appkit_semantic_edit
