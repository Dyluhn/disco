        require_workspace_epoch: true
      tool_scope:
        execution_disallows: [file_write, file_append, file_edit, file_replace_lines, shell, code_exec]
      revisions:
        initial_plan_revision: 1
        expected_final_plan_revision: 2
        forbid_write_before_revision_approval: true
      workspace:
        files:
          - path: .disco/appspec.json
            must_contain: ["AppKit Revised {{seed}}"]
          - path: .disco/designspec.json
