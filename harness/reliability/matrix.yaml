      - "packages/agent-server/tests/test_mcp_fence.py"
      - "packages/agent-server/tests/test_mcp_tool_search_cap.py"
      - "packages/agent-server/tests/test_workflow_router_wiring.py"
      - "packages/agent-server/tests/test_workflow_routes.py"
      - "packages/agent-server/tests/test_workflow_schedules.py"
      - "packages/agent-server/tests/test_novnc_live.py"
      - "packages/tools/tests/test_gvisor.py"
    claims: [agent.surface_runtime, agent.mcp_runtime, agent.workflow_runtime, agent.gvisor_novnc_runtime]

  - id: hermetic-search-runtime
    proof: hermetic
