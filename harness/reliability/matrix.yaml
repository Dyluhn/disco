      - "-m"
      - "harness.reliability.isolated_stack"
      - "--root"
      - "{suite_out}/stack"
      - "--cwd"
      - "{repo}"
      - "--agent-port"
      - "18101"
      - "--app-port"
      - "18901"
      - "--ui-port"
      - "5291"
      - "--sandbox-backend"
      - "podman"
