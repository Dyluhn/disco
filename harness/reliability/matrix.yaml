schema_version: 1

# A claim counts only when its suite produces non-skipped evidence. Live targets
# are intentionally larger than one green run. With zero failures, 300 trials put
# the rule-of-three 95% upper bound below 1% for that claim family.
claims:
  - id: build.event_contract
    surface: build
    proof: hermetic
    target: 1
    description: User, plan, approval, action, observation, and terminal ordering is fail-closed.
  - id: build.thrash_detection
    surface: build
    proof: hermetic
    target: 1
    description: Repeated calls, repeated tool errors, actionless pauses, and STUCK valves fail.
  - id: build.preview_export_truth
    surface: build
    proof: hermetic
    target: 1
    description: Preview, artifact, export download, verification, and cleanup claims require evidence.
  - id: build.resume_restore_runtime
    surface: build
    proof: hermetic
    target: 1
    description: Resume, workspace versions, restore, preview wake, and post-restore continuation work.
  - id: agent.surface_runtime
    surface: agent
    proof: hermetic
    target: 1
    description: Agent is durable across restart and uses the real build loop/tool executor.
  - id: agent.mcp_runtime
    surface: agent
    proof: hermetic
    target: 1
    description: MCP discovery, approval, fencing, egress, HTTP transport, and tool-search caps work.
  - id: agent.workflow_runtime
    surface: agent
    proof: hermetic
    target: 1
    description: Workflow authoring, sealing, scope, stack, scheduling, and promised output are verified.
  - id: agent.gvisor_novnc_runtime
    surface: agent
    proof: hermetic
    target: 1
    description: gVisor isolation, noVNC stream lifecycle, resource bounds, and cleanup work.
  - id: search.grounding_contract
    surface: search
    proof: hermetic
    target: 1
    description: Citations resolve to extracted passages and claim grades remain fail-closed.
  - id: search.deep_followup_export_audio
    surface: search
    proof: hermetic
    target: 1
    description: Deep reports, follow-ups, exports, and real audio bytes satisfy their contracts.
  - id: search.internet_mcp_sources
    surface: search
    proof: hermetic
    target: 1
    description: Internet and MCP retrieval flow through the same grounded citation pipeline.
  - id: settings.persistence_contract
    surface: settings
    proof: hermetic
    target: 1
    description: Every persisted settings DTO round-trips and is honored by the consuming runtime.
  - id: settings.ui_contract
    surface: settings
    proof: hermetic
    target: 1
    description: Settings controls expose wired save, probe, validation, and honest unavailable states.
  - id: frontend.fixture_routes
    surface: all
    proof: hermetic
    target: 1
    description: Every route and deterministic interaction remains functional in fixture mode.
  - id: backend.full_regression
    surface: all
    proof: hermetic
    target: 1
    description: The complete non-live Python package suite passes, not only curated reliability slices.
  - id: build.api_shapes_live
    surface: build
    proof: live
    target: 300
    description: Diverse bare Build shapes finish with locked output, trace, provider, and cleanup evidence.
  - id: build.revisions_live
    surface: build
    proof: live
    target: 100
    description: After-terminal and mid-run revision plans serialize without stale-plan writes.
  - id: build.complex_lifecycle_live
    surface: build
    proof: live
    target: 100
    description: Close/reopen, pause/resume, steer, export, rollback, and build-after-rollback all work.
  - id: build.preview_manifest_assets_live
    surface: build
    proof: live
    target: 4
    description: Build and Agent preserve the selected multi-file preview graph, isolated origins, and durable revisions.
  - id: agent.general_tasks_live
    surface: agent
    proof: live
    target: 300
    description: Agent completes promised filesystem/browser tasks with inspect and thrash evidence.
  - id: agent.workflow_mcp_live
    surface: agent
    proof: live
    target: 100
    description: Agent creates/reviews/runs workflows and invokes an approved MCP tool as promised.
  - id: agent.gvisor_novnc_live
    surface: agent
    proof: live
    target: 30
    description: A real gVisor browser task streams through noVNC and cleans up afterward.
  - id: search.grounding_live
    surface: search
    proof: live
    target: 300
    description: Live search returns reachable, resolvable, graded citations with useful follow-ups.
  - id: search.deep_live
    surface: search
    proof: live
    target: 100
    description: Live deep research produces nonempty grounded sections and supports follow-up continuation.
  - id: search.export_live
    surface: search
    proof: live
    target: 50
    description: Markdown and PDF downloads contain the report, follow-ups, and valid document bytes.
  - id: search.audio_live
    surface: search
    proof: live
    target: 30
    description: A newly generated report synthesizes uncached, playable MP3 and substantive transcript bytes.
  - id: search.mcp_retrieval_live
    surface: search
    proof: live
    target: 30
    description: An approved live MCP search provider is invoked and its public result becomes a grounded citation.
  - id: settings.roundtrip_live
    surface: settings
    proof: live
    target: 3
    description: Every settings family persists across reload and backend restart on an isolated stack.
  - id: fresh.install_boot_upgrade_uninstall
    surface: fresh_install
    proof: fresh_device
    target: 10
    description: A clean device installs, pairs, searches, builds, restarts, upgrades, exports, and uninstalls.

suites:
  - id: hermetic-python-full
    proof: hermetic
    kind: generic
    cwd: "{repo}"
    timeout_s: 3600
    memory_gib: 6
    units: 1
    command:
      - "{python}"
      - "-m"
      - "pytest"
      - "-q"
      - "-m"
      - "not live and not sandbox_integration"
      # Intentionally dormant revival harness for a router policy that is not
      # part of the active product. Ignoring it prevents a known collection-time
      # module skip from masquerading as missing promotion evidence.
      - "--ignore=packages/core/tests/test_router_overflow.py"
      - "packages"
    claims: [backend.full_regression]

  - id: hermetic-build-harness
    proof: hermetic
    kind: generic
    cwd: "{repo}"
    timeout_s: 900
    memory_gib: 3
    units: 1
    command:
      - "{python}"
      - "-m"
      - "pytest"
      - "-q"
      - "-m"
      - "not live"
      - "harness/build_soak/tests"
    claims: [build.event_contract, build.thrash_detection, build.preview_export_truth]

  - id: hermetic-build-runtime
    proof: hermetic
    kind: generic
    cwd: "{repo}"
    timeout_s: 900
    memory_gib: 3
    units: 1
    command:
      - "{python}"
      - "-m"
      - "pytest"
      - "-q"
      - "packages/agent-server/tests/test_resume.py"
      - "packages/agent-server/tests/test_resume_reconstruction.py"
      - "packages/agent-server/tests/test_workspace_versions.py"
      - "packages/agent-server/tests/test_preview_wake.py"
      - "packages/agent-server/tests/test_lifecycle.py"
    claims: [build.resume_restore_runtime]

  - id: hermetic-agent-runtime
