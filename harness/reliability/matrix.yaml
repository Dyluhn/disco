  - id: hermetic-frontend
    proof: hermetic
    kind: vitest
    cwd: "{frontend}"
    timeout_s: 1800
    memory_gib: 5
    units: 1
    command:
      - "npm"
      - "run"
      - "test"
      - "--"
      - "--reporter=json"
      - "--outputFile={suite_out}/vitest.json"
    claims: [settings.ui_contract]

  - id: hermetic-frontend-routes
