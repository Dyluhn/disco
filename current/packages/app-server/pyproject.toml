# The `app-server` package — the user-facing orchestrator (BoD §5.2): the
# settings (model-assignment matrix, skills, MCP) + library (conversation list/
# delete) gateway the frontend calls.
[project]
name = "disco-app-server"
version = "0.1.0"
description = "User-facing orchestrator: settings + library API over the core event store."
requires-python = ">=3.12"
dependencies = [
    "disco-core",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",  # proxy the public OpenRouter model catalogue
]

[project.scripts]
# The pairing token is derived from the install secret, not minted per boot, so
# it can be recomputed instead of hunted in a scrolled-away log line. Installed
# into the venv, so it runs in the compose image as `disco-pairing-token` (or
# `python -m disco.app_server.pairing_cli`).
disco-pairing-token = "disco.app_server.pairing_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disco"]

[tool.uv.sources]
disco-core = { workspace = true }
