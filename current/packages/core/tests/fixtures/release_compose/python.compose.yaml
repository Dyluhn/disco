services:
  web:
    build:
      context: "."
      dockerfile: "Dockerfile"
    restart: "unless-stopped"
    depends_on:
      migrate:
        condition: "service_completed_successfully"
    environment:
      API_TOKEN: "${API_TOKEN:?Set API_TOKEN — see .env.example}"
      DATABASE_URL: "file:/data/app.db"
      DEBUG: "${DEBUG}"
      PORT: "8080"
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - "app-data:/data"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).status<400 else 1)"
      interval: "10s"
      timeout: "3s"
      retries: 5
      start_period: "20s"
  migrate:
    build:
      context: "."
      dockerfile: "Dockerfile"
    restart: "no"
    command:
      - "alembic"
      - "upgrade"
      - "head"
    environment:
      DATABASE_URL: "file:/data/app.db"
    volumes:
      - "app-data:/data"
volumes:
  app-data: {}
