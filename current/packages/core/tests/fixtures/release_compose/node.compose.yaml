services:
  web:
    build:
      context: "."
      dockerfile: "Dockerfile"
    restart: "unless-stopped"
    depends_on:
      migrate:
        condition: "service_completed_successfully"
    environment:
      DATABASE_URL: "file:/data/app.db"
      LOG_LEVEL: "${LOG_LEVEL}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY — see .env.example}"
      PORT: "8080"
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - "app-data:/data"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: "10s"
      timeout: "3s"
      retries: 5
      start_period: "20s"
  migrate:
    build:
      context: "."
      dockerfile: "Dockerfile"
    restart: "no"
    command:
      - "npm"
      - "run"
      - "migrate"
    environment:
      DATABASE_URL: "file:/data/app.db"
    volumes:
      - "app-data:/data"
volumes:
  app-data: {}
