name: evidence-harness

# The evidence-harness gates (campaign: docs/disco-evidence-harness-campaign.md). Two tiers,
# matching the synthesized plan:
#
#  - pr-evidence (GitHub-hosted, REQUIRED, deterministic, NO browser): the fast input/output
#    contracts that the ~1800 mocked-middle unit tests miss — boundary contracts (W1/W2/W3/W10),
#    the frontend event-store REPLAY suite (W9, catches the plan-progress bug with no browser),
#    the cheap artifact validators (W14a), and the disco-verify runner unit tests (W15).
#
#  - nightly-vm (self-hosted VM 201, advisory): the heavy/real tier — Playwright full specs
#    (W11/W12), live disco-verify scenarios (W13), and render-it heavy validators (W14b).
#    Runs on the dedicated browser host (Playwright OOMs the memcapped workstation), so it is
#    scheduled / manual, never on the PR critical path.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *" # nightly VM tier
  workflow_dispatch:

jobs:
  pr-evidence:
    name: pr-evidence (boundary + replay + validators, no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync Python deps
        run: uv sync

      # Heavy/cheap artifact validators shell out to these — install them so the
      # validator tests exercise the real tools, not just their guard paths.
      - name: System tools for artifact validators
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg

      - name: Boundary contracts (W1/W2/W3/W10)
        run: uv run pytest packages -m boundary_contract -p no:cacheprovider

      - name: Artifact validators + disco-verify runner (W14a/W15)
        run: |
          uv run pytest \
            packages/tools/tests/test_artifact_validators.py \
            packages/tools/tests/test_deck_validators.py \
            packages/tools/tests/test_heavy_validators.py \
            packages/agent-server/tests/test_disco_verify_runner.py \
            packages/core/tests/test_evidence_schema.py \
            packages/agent-server/tests/integration/test_scripted_smoke.py \
            packages/agent-server/tests/test_debug_evidence_route.py \
            -p no:cacheprovider

      - name: Frontend event-store replay (W9 — no browser)
        run: |
          cd frontend
          npm ci
          npx vitest run src/lib/buildTrace.replay.test.ts

  nightly-vm:
    name: nightly-vm (Playwright + live scenarios + heavy validators)
    # The VM 201 evidence host registered as a self-hosted runner with this label.
    # Skipped on normal PRs/pushes; runs on the nightly schedule or manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, vm201]
    # NOT continue-on-error: this runs on the dedicated VM 201 evidence host where the live
    # infra (tunnel + render binaries) IS present, so a live-scenario / heavy-validator
    # failure is a REAL regression and must turn the workflow red (codex round-2).
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync Python deps
        run: uv sync

      # Render binaries for the HEAVY validators (W14b) — present on the VM 201 host but
      # installed here for hosted self-runners too, so the render path actually executes.
      - name: Render tools for heavy validators (LibreOffice/poppler/ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils ffmpeg

      # Heavy (render-it) validators — these were claimed by the nightly tier but never run.
      - name: Heavy validators (W14b — LibreOffice/poppler render)
        run: uv run pytest packages/tools/tests/test_heavy_validators.py -p no:cacheprovider

      # Requires the workstation dev servers (5173/8000) reachable on this host's
      # localhost (the reverse SSH tunnel). The full Playwright config + live
      # disco-verify scenarios produce dossiers under test-record/.
      - name: Evidence-harness Playwright specs (W11/W12)
        run: |
          cd frontend
          npm ci
          npx playwright install firefox chromium
          npx playwright test --config e2e-full/full.config.ts

      # NOT masked with `|| true`: a live-scenario failure must FAIL this job (it's the most
      # important tier — the whole point is catching real input→output regressions).
      - name: Live disco-verify scenarios (W13)
        run: uv run python -m disco.agent_server.verify.scenarios_run

      - name: Upload evidence dossiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-dossiers
          path: |
            frontend/test-record/e2e-full/**
            test-record/**
