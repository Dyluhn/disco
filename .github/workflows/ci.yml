name: CI

# Deterministic required gate. The `required` job runs the exact ordered
# architecture/governance gates followed by the persistent non-web conformance
# test and the deterministic suites. The `advisory` job runs broader,
# environment-dependent checks (full pytest incl. integration, eslint, full
# `tsc -b` over tests). It is `continue-on-error` so it informs without
# blocking — those carry known debt / need external services not present on a
# vanilla runner.

on:
  push:
  pull_request:

jobs:
  required:
    name: required (gates + unit + build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Soak freeze
        run: uv run python scripts/check_soak_freeze.py

      - name: Governance seal
        run: uv run python scripts/check_governance_seal.py

      - name: Architecture budget
        run: uv run python scripts/check_arch_budget.py

      - name: Architecture debt
        run: uv run python scripts/check_arch_debt.py

      - name: Architecture imports
        run: uv run python scripts/check_arch_imports.py

      - name: Architecture diagram freshness
        run: uv run python scripts/gen_arch_diagram.py --check

      - name: Public API
        run: uv run python scripts/check_public_api.py

      - name: Test inventory
        run: uv run python scripts/check_test_inventory.py

      - name: CI contract
        run: uv run python scripts/check_ci_contract.py

      - name: Tool schemas
        run: uv run python scripts/check_tool_schemas.py

      - name: Persistent non-web conformance
        run: uv run pytest -q packages/core/tests/test_build_platform_nonweb_conformance.py

      # The adversarial suite guarding the seal, ownership and inventory
      # machinery. It is also inside `testpaths`, so the unit-test step below
      # covers it — this step names the path explicitly so the gate survives
      # any future narrowing of testpaths. It was inventoried but never run
      # for the whole campaign, and the first execution found nine real
      # defects; it does not go unnamed again.
      - name: Architecture machinery tests (tests/architecture)
        run: uv run pytest -q tests/architecture

      - name: Python type-check (basedpyright — strict, zero type errors tree-wide)
        run: uv run basedpyright

      - name: Unit tests (excludes integration — see advisory job)
        run: uv run pytest -m "not integration"

      - name: Frontend shipping-file typecheck (honest gate)
        working-directory: frontend
        run: npm run typecheck:build

      - name: Frontend production build
        working-directory: frontend
        run: npx vite build

      - name: Frontend unit tests (vitest)
        working-directory: frontend
        run: npm run test

  advisory:
    name: advisory (full suite, eslint, full tsc)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      - name: Full pytest (incl. integration — needs browser/shell/docker)
        run: uv run pytest

      # Advisory: harness/tests includes a contract suite that currently flags a
      # KNOWN PRE-EXISTING drift — the RP-08 `schedule` / `schedule_run` event
      # kinds have no TypeScript mirror (tracked as a follow-up). It runs here so
      # the drift stays visible without blocking the required gate.
      - name: Harness tests (contract/fuzz/eval — advisory)
        run: PYTHONPATH=. uv run pytest harness/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint (style debt — advisory)
        working-directory: frontend
        run: npm run lint

      - name: Full project typecheck (includes test files — advisory)
        working-directory: frontend
        run: npx tsc -b
