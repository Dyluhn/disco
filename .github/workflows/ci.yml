name: CI

# Deterministic required gate. The `required` job runs the exact ordered
# development/architecture/governance gates followed by the persistent non-web conformance
# test and the deterministic suites. The `advisory` job runs broader,
# environment-dependent checks (full pytest incl. integration, eslint, full
# `tsc -b` over tests). It is `continue-on-error` so it informs without
# blocking — those carry known debt / need external services not present on a
# vanilla runner.

# `branches: ["**"]` means every branch and NO tags: the governance identity
# anchor is published as a tag whose tree is empty, and a tag push must not
# start a run that has no workflow files to run. Release tags are release.yml's
# job. The schedule + dispatch triggers exist for the advisory job, which is
# too slow to sit on the push path (see its `if:`).
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Pushes land in bursts during a landing. Superseding runs on the same branch
# cancel; main never cancels, because its runs are the record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  required:
    name: required (gates + unit + build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # The artifact validators shell out to pdfinfo (test_artifact_validators
      # asserts a real PDF validates); the hosted image does not ship poppler.
      - name: System tools for artifact validators
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # Python lint, scoped to the five shipping source roots — the same set
      # `[tool.pyright] include` names, and the code that actually ships.
      #
      # Not the whole tree, and the reason is recorded rather than hidden:
      # measured 2026-09-10, `ruff check .` reports 134 findings, 121 of them in
      # tests, dev scripts and the harness. Four of the dirty files
      # (gen_closeout_acceptance_manifest.py, verify_export_track1_closeout.py,
      # closeout_pytest_report.py, closeout_manifest_parts/_remediation.py) are
      # FROZEN closeout acceptance evidence whose bytes are hashed in
      # development/notes/export-track1-closeout-acceptance.sha256 — reformatting them
      # is not a cosmetic change, it rewrites an acceptance record. `[tool.ruff]
      # extend-exclude` already says exactly that about the frozen test dirs.
      # So this gate is real over the shipping source and silent about a backlog
      # it must not touch, instead of green over nothing. Widen it by clearing
      # the backlog, never by adding an ignore.
      - name: Lint (ruff — shipping source)
        run: uv run ruff check packages/core/src packages/retrieval/src packages/tools/src packages/agent-server/src packages/app-server/src

      - name: Soak freeze
        run: uv run python development/scripts/check_soak_freeze.py

      - name: Governance seal
        run: uv run python development/scripts/check_governance_seal.py

      - name: Architecture budget
        run: uv run python development/scripts/check_arch_budget.py

      - name: Architecture debt
        run: uv run python development/scripts/check_arch_debt.py

      - name: Architecture imports
        run: uv run python development/scripts/check_arch_imports.py

      - name: Architecture diagram freshness
        run: uv run python development/scripts/gen_arch_diagram.py --check

      - name: Public API
        run: uv run python development/scripts/check_public_api.py

      - name: Test inventory
        run: uv run python development/scripts/check_test_inventory.py

      - name: CI contract
        run: uv run python development/scripts/check_ci_contract.py

      - name: Tool schemas
        run: uv run python development/scripts/check_tool_schemas.py

      - name: Persistent non-web conformance
        run: uv run pytest -q packages/core/tests/test_build_platform_nonweb_conformance.py

      # The adversarial suite guarding the seal, ownership and inventory
      # machinery. It is also inside `testpaths`, so the unit-test step below
      # covers it — this step names the path explicitly so the gate survives
      # any future narrowing of testpaths. It was inventoried but never run
      # for the whole campaign, and the first execution found nine real
      # defects; it does not go unnamed again.
      - name: Architecture machinery tests (development/tests/architecture)
        run: uv run pytest -q development/tests/architecture

      - name: Python type-check (basedpyright — strict, zero type errors tree-wide)
        run: uv run basedpyright

      - name: Unit tests (excludes integration — see advisory job)
        run: uv run pytest -m "not integration"

      - name: Frontend shipping-file typecheck (honest gate)
        working-directory: frontend
        run: npm run typecheck:build

      # PKG-02-GATE-E2ELIVE-TYPECHECK (finding F24). `frontend/e2e-live` was
      # type-checked by NO tsconfig project: app includes only `src`, node only
      # `vite.config.ts`, build excludes tests, and the root project references
      # just app+node — so the advisory job's `npx tsc -b` could not reach the 38
      # live specs either. Playwright transpiles rather than type-checks, so
      # `test:e2e` never saw their types. Two real errors shipped in that vacuum.
      # Required, not advisory, on the same reasoning recorded below for the
      # ESLint promotion: a gate that runs only in the advisory job
      # (continue-on-error: true) cannot hold a line. Doubly so here — measured
      # 2026-08-06e, the advisory `npx tsc -b` step is itself already red on 13
      # pre-existing errors under src/, so its exit code carries no signal to
      # add a gate to. Verified green BEFORE being made required — never
      # wired-then-silenced.
      # Invoked directly rather than through an npm script, matching how
      # tsconfig.closeout-g11.json is driven (development/scripts/closeout_verify_parts/
      # _lanes.py). frontend/package.json is one of the 15 change-controlled
      # contract files in development/architecture/public-api.json, and non-diagram contract
      # bytes cannot be rebaselined by any sanctioned path — so a dedicated
      # type-check scope is wired at its call sites, never by amending it.
      - name: Frontend live-e2e typecheck (F24 — e2e-live had no project)
        working-directory: frontend
        run: npx tsc -p tsconfig.e2e-live.json --noEmit

      - name: Frontend production build
        working-directory: frontend
        run: npx vite build

      # `npm run test` is bare `vitest run`, which sizes its pool from the host's
      # CPU count. On the 2-core hosted runner that is fine; the bound is here
      # because the same suite is flaky when vitest fans out 12 ways on the
      # workstation, and CI should run the configuration we trust. package.json
      # is one of the 15 change-controlled contract files, so the bound is
      # applied at the call site rather than by amending the script.
      - name: Frontend unit tests (vitest — bounded workers)
        working-directory: frontend
        run: npx vitest run --maxWorkers=2 --minWorkers=1

      # Amendment A3 restores the `api/client.ts` funnel with a
      # `no-restricted-imports` boundary rule. A boundary rule that runs only in
      # the advisory job cannot hold a line, so ESLint is promoted here — the
      # same move Amendment A2 made for development/tests/architecture, and on the same
      # precondition: it was verified green BEFORE being made required, never
      # wired-then-silenced. The advisory job keeps its own full-tsc step.
      - name: ESLint (import boundaries + style — required since Epic 12-A)
        working-directory: frontend
        run: npm run lint

  advisory:
    name: advisory (full suite, full tsc)
    runs-on: ubuntu-latest
    continue-on-error: true
    # NOT on the push path. Measured 2026-09-10, the full pytest step alone
    # takes 21 minutes, so on every push this job held the CI workflow
    # `in_progress` for twice as long as the required gate that actually
    # decides the verdict — and it is `continue-on-error: true`, so none of
    # that time changed an answer. It keeps its full breadth on the nightly
    # schedule and on manual dispatch, where the wait costs nobody a review.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      # Node BEFORE pytest. development/tests/architecture drives the pinned
      # TypeScript compiler out of frontend/node_modules; without it
      # this job reported ~50 FileNotFoundError failures that said nothing
      # about the tree, only that the job had not installed the frontend.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Full pytest (incl. integration — needs browser/shell/docker)
        run: uv run pytest

      # Advisory. The Python↔TS drift this comment used to describe is GONE:
      # `schedule` / `schedule_run` have had TypeScript mirrors for some time,
      # and Epic 12-A closed the remaining event-kind and frame-type gaps, so
      # development/harness/tests/test_contract.py is green and its allowlists are empty.
      # That parity is now also enforced fail-closed in the required job by
      # packages/core/tests/test_frontend_contract_parity.py, which reads the TS
      # side with the pinned compiler instead of a regex.
      #
      # This job stays advisory for the one KNOWN remaining failure here:
      # test_replay_runner.py::test_deterministic_replay_reproduces_recorded_events
      # (unrelated to contract parity, reproduces at the Epic 12-A parent
      # a9daf96d, unowned as of this writing).
      # PKG-19-CERT-STRUCTURAL finding F2: this named development/harness/tests only, so the
      # certified harness ids outside it — build_soak, marathon, replay — ran in
      # no lane at all. Widened to the whole tree to match `make harness`;
      # F6-b's `live` marker on the marathon phases keeps it hermetic.
      - name: Harness tests (contract/fuzz/eval — advisory)
        run: uv run pytest development/harness

      # PKG-19-CERT-STRUCTURAL finding F2: the `integrations` root carried 9
      # certified ids and was named by no Makefile target and no CI step.
      - name: Integrations tests (advisory)
        run: uv run pytest integrations

      - name: ESLint (style debt — advisory)
        working-directory: frontend
        run: npm run lint

      - name: Full project typecheck (includes test files — advisory)
        working-directory: frontend
        run: npx tsc -b
