name: e2e-live (nightly, advisory)

# REAL end-to-end UI acceptance — drives the ACTUAL stack (app-server :8800 +
# agent-server :8000 + a LIVE driver model) through Firefox and saves screenshots
# as evidence. This is the "prove it from the UI all the way to the other end of
# the application" job: nothing here is mocked.
#
# Why nightly + self-hosted ONLY (never on PR, never a required gate):
#   - The specs need a real LLM. GitHub-hosted runners have no GPU, and we do NOT
#     ship a provider key into CI (the FREE-models-only-in-dev rule + no secret
#     expansion). Only a self-hosted runner with the local model reachable can run
#     this, so the job targets the `disco-live` label. It is NEVER faked on a
#     hosted runner — a stub model would be a false green, proving nothing.
#   - A live build turn on the local 27B takes minutes; the suite is slow and
#     non-deterministic by design (see playwright.live.config.ts: 15-min/spec).
#     It INFORMS via artifacts + job status; it never blocks a PR.
#
# Enable by registering a self-hosted runner labelled `disco-live` on a host where
# the local model is up and the agent-server's secrets are present in the runner
# environment (DISCO_SECRET_KEY, and any provider keys the configured models use).
# Without that runner the scheduled job simply doesn't run — it is never faked.

# The nightly `schedule` is GONE as of 2026-09-10. The repository has ZERO
# self-hosted runners registered, so the 08:00 job could never be picked up and
# every night produced a red run that said nothing about the tree. Manual
# dispatch keeps the suite exactly as capable as it was; re-add
# `schedule: - cron: "0 8 * * *"` the day a `disco-live` runner is registered.
on:
  workflow_dispatch: {} # manual run from the Actions tab

jobs:
  e2e-live:
    name: e2e-live (real stack + model)
    runs-on: [self-hosted, disco-live]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: current/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: current/frontend
        run: npm ci

      - name: Install Playwright Firefox
        working-directory: current/frontend
        run: npx playwright install firefox

      - name: Boot ephemeral backend (agent-server :8000 + app-server :8800)
        run: |
          set -euo pipefail
          # Throwaway event DB so a nightly run never touches real conversations.
          # (Model ASSIGNMENTS live in the runner's config store, not this DB, so a
          # fresh events DB still routes to the live local model.)
          DB_DIR="$(mktemp -d)"
          {
            echo "DISCO_DB=${DB_DIR}/e2e.db"
            echo "DISCO_HOST=127.0.0.1"
            # The dev server (Playwright boots it on :5174) reads these to reach the
            # live backend — mirror .env.development.local for a clean CI checkout.
            echo "VITE_AGENT_BASE=http://127.0.0.1:8000"
            echo "VITE_API_BASE=http://127.0.0.1:8800"
            echo "VITE_OWNER_ID=local"
          } >> "$GITHUB_ENV"
          export DISCO_DB="${DB_DIR}/e2e.db" DISCO_HOST=127.0.0.1
          # agent-server :8000 (per-conversation runtime — the loop the UI talks to)
          DISCO_PORT=8000 uv run python -m disco.agent_server >"${DB_DIR}/agent.log" 2>&1 &
          echo "AGENT_PID=$!" >> "$GITHUB_ENV"
          # app-server :8800 (user-facing orchestrator)
          DISCO_PORT=8800 uv run python -m disco.app_server >"${DB_DIR}/app.log" 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          echo "BACKEND_LOG_DIR=${DB_DIR}" >> "$GITHUB_ENV"
          # Wait for the agent-server /health to go green (specs fail fast otherwise).
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "agent-server never became healthy"; cat "${DB_DIR}/agent.log"; exit 1; }

      - name: Run live e2e specs (Firefox, real model)
        working-directory: current/frontend
        run: npx playwright test --config playwright.live.config.ts

      - name: Tear down backend
        if: always()
        run: kill "${AGENT_PID:-}" "${APP_PID:-}" 2>/dev/null || true

      - name: Upload evidence (screenshots + traces + server logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-evidence
          path: |
            current/frontend/test-results/**
            current/frontend/e2e-live/**/*.png
            ${{ env.BACKEND_LOG_DIR }}/*.log
          if-no-files-found: ignore
          retention-days: 14
