name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  draft-release:
    name: draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Soak freeze
        run: uv run python development/scripts/check_soak_freeze.py

      - name: Governance seal
        run: uv run python development/scripts/check_governance_seal.py

      - name: Architecture budget
        run: uv run python development/scripts/check_arch_budget.py

      - name: Architecture debt
        run: uv run python development/scripts/check_arch_debt.py

      - name: Architecture imports
        run: uv run python development/scripts/check_arch_imports.py

      - name: Architecture diagram freshness
        run: uv run python development/scripts/gen_arch_diagram.py --check

      - name: Public API
        run: uv run python development/scripts/check_public_api.py

      - name: Test inventory
        run: uv run python development/scripts/check_test_inventory.py

      - name: CI contract
        run: uv run python development/scripts/check_ci_contract.py

      - name: Tool schemas
        run: uv run python development/scripts/check_tool_schemas.py

      - name: Persistent non-web conformance
        run: uv run pytest -q packages/core/tests/test_build_platform_nonweb_conformance.py

      - name: Python type check
        run: uv run basedpyright

      - name: Python unit suites
        run: uv run pytest -m "not integration"

      - name: Frontend unit suite
        working-directory: frontend
        run: npm run test

      - name: Frontend shipping-file typecheck
        working-directory: frontend
        run: npm run typecheck:build

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Package frontend build
        run: |
          mkdir -p release-artifacts
          tar -C frontend/dist -czf "release-artifacts/disco-frontend-dist-${GITHUB_REF_NAME}.tar.gz" .

      - name: Extract changelog section
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^##\s+v?{re.escape(version)}(?:\s|$).*", re.MULTILINE)
          match = heading.search(text)
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no section for {tag}")
          next_heading = re.search(r"^##\s+", text[match.end():], re.MULTILINE)
          end = match.end() + next_heading.start() if next_heading else len(text)
          body = text[match.start():end].strip()
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: disco-frontend-dist-${{ github.ref_name }}
          path: release-artifacts/*.tar.gz

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > .release-is-draft 2>/dev/null; then
            if [ "$(cat .release-is-draft)" != "true" ]; then
              echo "Refusing to modify published release $TAG; this workflow is draft-only." >&2
              exit 1
            fi
            gh release edit "$TAG" --draft --title "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

  # Prebuilt images. Both jobs run only after every gate in draft-release has
  # passed (check_ci_contract requires that dependency). Each arch builds on a
  # native runner and pushes by digest; the manifests job joins the digests
  # into one multi-arch tag per image. A hyphenated tag (v1.2.0-rc1) does not
  # move `latest`.
  images:
    name: image ${{ matrix.image }} ${{ matrix.arch }}
    needs: draft-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - server
          - frontend
          - sandbox
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: server
            dockerfile: deploy/compose/Dockerfile.server
          - image: frontend
            dockerfile: frontend/Dockerfile
          - image: sandbox
            dockerfile: deploy/sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image reference
        id: ref
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/disco-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            DISCO_BUILD_TAG=${{ github.ref_name }}
            DISCO_BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ steps.ref.outputs.ref }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  manifests:
    name: multi-arch manifests
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Create and push manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for image in server frontend sandbox; do
            ref="$namespace/disco-$image"
            tags=(-t "$ref:$TAG")
            case "$TAG" in *-*) ;; *) tags+=(-t "$ref:latest") ;; esac
            docker buildx imagetools create "${tags[@]}" \
              "$ref@$(cat "digests/$image-amd64")" \
              "$ref@$(cat "digests/$image-arm64")"
            docker buildx imagetools inspect "$ref:$TAG"
          done
