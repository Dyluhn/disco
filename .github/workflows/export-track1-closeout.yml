name: export-track1-closeout

# The FROZEN, non-bypass acceptance gate for the Export Track-1 Closeout campaign
# (WO-C0, plan §1 / §3 / §12.12). ONE required, non-advisory job invokes the wired
# verifier, which runs EVERY lane and computes the single pass verdict:
#   python-nonlive · python-closeout ·
#   frontend (vitest + typecheck + build + Firefox e2e gate) · g11-typecheck ·
#   live-docker (REAL engine, fail-not-skip) · anti-bypass-scan (incl. G18 diff scan).
# There is NO advisory / continue-on-error / skip path — a red harness turns the check
# red. The live Docker proof is a FINAL closeout requirement (plan §1.3 / §3.4 / §12.12)
# and is part of --all, so this job runs on a self-hosted runner that has a real Docker
# Engine + Compose v2 AND Node (the frontend lane). Evidence is uploaded on success AND
# failure so a reviewer can inspect the machine-readable manifest for the exact
# candidate SHA (plan §1.4). Exit code is truth.

# Two reasons this workflow was red on every push, both fixed 2026-09-10:
# 1. The job-level `env` read `${{ runner.temp }}`, and the `runner` context is
#    not available at job level. GitHub rejected the file at parse time, so no
#    run ever produced a job or a log. The verifier step carries that env now.
# 2. The acceptance job needs a self-hosted runner labelled `self-hosted, docker,
#    export-track1-closeout` — a real Docker Engine + Compose v2 for the live
#    lane and Node for the frontend lane — and the repository has no self-hosted
#    runners registered. A gate that cannot execute is not a gate.
#
# So the split below. `manifest-freshness` is the part of this contract a hosted
# runner CAN honestly prove — that the frozen acceptance manifest still matches
# the frozen files byte for byte — and it stays on every push and PR.
# `closeout-acceptance` is manual dispatch, and it stays exactly as strict as it
# was: register the runner, dispatch it, and it runs every lane including the
# live Docker proof. Re-add `push:`/`pull_request:` to that job's `if:` the day
# the runner is back.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One acceptance run per ref; never cancel a run mid-way (evidence must complete).
concurrency:
  group: export-track1-closeout-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Hosted, cheap (~3 s after provisioning), and the reason this workflow still
  # has something to say on a push: the frozen acceptance manifest hashes 50
  # frozen files, and this proves none of them moved under it.
  manifest-freshness:
    name: acceptance manifest is byte-fresh (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      - name: Acceptance manifest is byte-fresh (frozen-file tamper check)
        run: uv run python development/scripts/gen_closeout_acceptance_manifest.py --check

      - name: What the full acceptance run still needs
        if: always()
        run: |
          {
            echo "### Export Track-1 closeout acceptance"
            echo
            echo "This hosted job proves only that the frozen acceptance manifest is byte-fresh."
            echo
            echo "The full verifier (\`--all\`: python-nonlive, python-closeout, frontend +"
            echo "Firefox e2e, g11-typecheck, live-docker, anti-bypass-scan) runs on manual"
            echo "dispatch and needs a self-hosted runner labelled:"
            echo
            echo '    self-hosted, docker, export-track1-closeout'
            echo
            echo "with a real Docker Engine + Compose v2 and Node 22. The repository currently"
            echo "has no self-hosted runners registered, so that job is dispatch-only."
          } >> "$GITHUB_STEP_SUMMARY"

  closeout-acceptance:
    # Manual dispatch only while no runner carries these labels — see `on:`.
    if: github.event_name == 'workflow_dispatch'
    name: closeout acceptance (wired verifier — required, non-advisory, live)
    # A real Docker Engine + Compose v2 (the live lane) AND Node (the frontend lane)
    # must be present; the verifier's live tests FAIL — never skip — without an engine.
    runs-on: [self-hosted, docker, export-track1-closeout]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the verifier records the exact candidate SHA

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync Python deps
        run: uv sync --all-packages

      - name: Install frontend deps
        run: npm ci
        working-directory: current/frontend

      - name: Install Playwright Firefox (browser e2e lane)
        # The verifier's browser lane runs the frozen Firefox proofs via
        # `npx playwright test … --project=firefox`; the browser + its OS deps must be
        # present, or the browser lane records browser_run_failed and turns the required
        # check red. Firefox only (headless chromium cannot rasterize text/oklch here).
        run: npx playwright install --with-deps firefox
        working-directory: current/frontend

      - name: Acceptance manifest is byte-fresh (frozen-file tamper check)
        run: uv run python development/scripts/gen_closeout_acceptance_manifest.py --check

      - name: Run the wired closeout verifier (all lanes, live + browser required)
        # Evidence lives OUTSIDE the checkout (plan §1.4); the verifier refuses an
        # in-checkout path. RUNNER_TEMP is a sibling of the workspace. Step-level
        # env, because the `runner` context is unavailable at job level.
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/closeout-evidence
        run: >-
          uv run python development/scripts/verify_export_track1_closeout.py
          --all --evidence-dir "$EVIDENCE_DIR"

      - name: Upload evidence (success AND failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closeout-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/closeout-evidence
          if-no-files-found: error
