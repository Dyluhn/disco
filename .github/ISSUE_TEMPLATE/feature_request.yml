name: Feature request
description: Propose a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing something large, it's worth skimming
        [`basis-of-design.md`](https://github.com/Dyluhn/disco/blob/main/current/docs/contracts/basis-of-design.md)
        and [`event-state-contract.md`](https://github.com/Dyluhn/disco/blob/main/current/docs/contracts/event-state-contract.md) —
        the design authorities any change has to fit inside. Small, focused
        requests don't need this.

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which surface does this affect?
      options:
        - Search
        - Deep Research
        - Build
        - Agent
        - Cross-surface / platform (event log, LLM router, sandbox, MCP, ...)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap or friction, not just the feature. What can't you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you want to happen? A rough shape is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, related issues.
    validations:
      required: false
